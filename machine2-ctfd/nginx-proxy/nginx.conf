events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Suppress server version disclosure
    server_tokens off;

    # Anti-bruteforce and rate limiting zones
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=flag_bruteforce_limit:10m rate=5r/m;

    upstream ctfd_backend {
        server ctfd:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;
        client_body_buffer_size 128k;

        # Hardened HTTP Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Block access to hidden system files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Anti-bruteforce rate limiting on flag submissions (max 5/min)
        location = /api/v1/challenges/attempt {
            limit_req zone=flag_bruteforce_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://ctfd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Regular CTFd web traffic
        location / {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://ctfd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}